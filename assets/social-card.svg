<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Anti-Hallucination Crypto Agent, powered by CryptoCapi</title>
  <desc id="dsc">Share card at 2:1. The same sealed-robot mark as the repository banner, composed for the ratio GitHub and LinkedIn ask for, with room for the product claim.</desc>

  <defs>
    <pattern id="mesh" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 L0 0 L0 26" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Full bleed, no rounded corners: a social card is displayed as a rectangle,
       and a transparent corner would show through as white on a light feed. -->
  <rect x="0" y="0" width="1280" height="640" fill="#000000"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#mesh)"/>

  <!-- ===== emblem =====
       The banner's mark, scaled as a whole rather than redrawn, so the two
       assets cannot drift apart. -->
  <g transform="translate(-352 16.2625) scale(1.55)">
    <g stroke="#a78bfa" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M556 68 L546 68 L546 182 L556 182"/>
      <path d="M724 68 L734 68 L734 182 L724 182"/>
    </g>

    <line x1="640" y1="57" x2="640" y2="74" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="640" cy="52" r="5.5" fill="#a78bfa"/>

    <rect x="572" y="108" width="9" height="30" rx="4.5" fill="#a78bfa" fill-opacity="0.45"/>
    <rect x="699" y="108" width="9" height="30" rx="4.5" fill="#a78bfa" fill-opacity="0.45"/>

    <rect x="582" y="74" width="116" height="102" rx="24" fill="#101014" stroke="#a78bfa" stroke-width="2"/>

    <rect x="600" y="98" width="80" height="36" rx="11" fill="#08080a" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
    <polyline points="606,124 616,113 626,118 636,110 646,120 656,112 666,119 674,115" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="#a78bfa" fill-opacity="0.38">
      <rect x="607" y="150" width="16" height="7" rx="3.5"/>
      <rect x="632" y="150" width="16" height="7" rx="3.5"/>
      <rect x="657" y="150" width="16" height="7" rx="3.5"/>
    </g>

    <circle cx="706" cy="170" r="18" fill="#000000" stroke="#34d399" stroke-width="2"/>
    <path d="M698 170 l5.5 6 l10 -12" fill="none" stroke="#34d399" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== wordmark ===== -->
  <text x="644" y="386" text-anchor="middle" font-size="58" font-weight="800" letter-spacing="8" fill="#e8ebf2">ANTI-HALLUCINATION</text>
  <text x="646.5" y="428" text-anchor="middle" font-size="24" font-weight="600" letter-spacing="13" fill="#9aa4b2">CRYPTO AGENT</text>

  <!-- the claim: the vertical room the 3.2:1 banner did not have -->
  <text x="640" y="482" text-anchor="middle" font-size="20" fill="#9aa4b2">AI crypto analysis that <tspan fill="#e8ebf2" font-weight="600">proves</tspan> it didn&#8217;t make anything up.</text>

  <line x1="540" y1="524" x2="740" y2="524" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>

  <!-- ===== signature ===== -->
  <g transform="translate(520.095 543.857) scale(0.047619)">
